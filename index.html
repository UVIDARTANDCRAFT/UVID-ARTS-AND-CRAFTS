<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UVID Arts and Crafts</title>
  

<style>
body{
font-family:Arial,sans-serif;
margin:0;
background:#f4f4f4;
}

header{
background:#222;
color:white;
padding:20px;
text-align:center;
}

.search-box{
padding:20px;
text-align:center;
}

.search-box input{
width:90%;
max-width:500px;
padding:12px;
font-size:16px;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.product{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,.1);
}

.product img{
width:100%;
height:220px;
object-fit:cover;
border-radius:8px;
}

.product h3{
margin:10px 0;
}

.price{
font-size:18px;
font-weight:bold;
}

button{
background:#25D366;
border:none;
color:white;
padding:10px;
width:100%;
cursor:pointer;
border-radius:5px;
margin-top:10px;
}

.cart-box{
background:white;
margin:20px;
padding:20px;
border-radius:10px;
}

.cart-count{
position:fixed;
right:15px;
top:15px;
background:red;
color:white;
padding:10px 15px;
border-radius:30px;
font-weight:bold;
}

input.checkout{
width:100%;
padding:10px;
margin:10px 0;
}
</style>
</head>

<body>

<header>
<h1>UVID Arts and Crafts</h1>
<p>Order directly on WhatsApp</p>
</header>

<div class="cart-count">
Cart: <span id="cartCount">0</span>
</div>

<div class="search-box">
<input
type="text"
id="search"
placeholder="Search products..."
onkeyup="renderProducts()">
</div>

  <select id="categoryFilter" onchange="renderProducts()">
<option value="">All Categories</option>
<option value="BRUSHES">BRUSHES</option>
<option value="PAINTS">PAINTS</option>
<option value="CANVAS">CANVAS</option>
<option value="TOOLS">TOOLS</option>
<option value="PIPECLEANERS">PIPECLEANERS</option>
</select>

<div id="products" class="products"></div>

<div class="cart-box">
<h2>Your Cart</h2>

<ul id="cartItems"></ul>

<input
class="checkout"
id="customerName"
placeholder="Your Name">

<input
class="checkout"
id="customerPhone"
placeholder="Phone Number">

  <input
class="checkout"
id="customerAddress"
placeholder="Delivery Address">

<button onclick="checkoutWhatsApp()">
Order on WhatsApp
</button>
</div>

<script>

const SUPABASE_URL = "https://uhhyxilritfvcygnyqyp.supabase.co";
const SUPABASE_KEY = "sb_publishable_JHgNBbOApKSF0b_7d1YljA_ytdqf_iO";

let products = [];

async function loadProducts() {

const response = await fetch(
`${SUPABASE_URL}/rest/v1/products?select=*`,
{
headers:{
apikey: SUPABASE_KEY,
Authorization: `Bearer ${SUPABASE_KEY}`
}
}
);

products = await response.json();
  console.log(products);

products = products.map(product => ({
id: product.id,
name: product.name,
price: product.price,
stock: product.stock,
category: product.category,
image: `${SUPABASE_URL}/storage/v1/object/public/products/${product.image_path}`
}));

renderProducts();

}

loadProducts();

let cart=[];

function renderProducts(){

const search =
document.getElementById("search")
.value
.toLowerCase();

let html="";

const selectedCategory =
document.getElementById("categoryFilter").value;

products
.filter(p =>
p.name.toLowerCase().includes(search)
)
.filter(p =>
selectedCategory === "" ||
(p.category || "").toLowerCase() === selectedCategory.toLowerCase()
)
.forEach(product=>{

html += `
<div class="product">
<a href="${product.image}" target="_blank">
<img src="${product.image}">
</a>

<h3>${product.name}</h3>
<div><b>${product.category}</b></div>
${product.stock > 0
? `<div>Stock: ${product.stock}</div>`
: `<div><b>OUT OF STOCK</b></div>`
}
<div class="price">₹${product.price}</div>

${product.stock > 0
? `
<button onclick="addToCart('${product.name}',${product.price})">
Add To Cart
</button>
`
: `
<button disabled>
OUT OF STOCK
</button>
`
}
</div>
`;

});

document.getElementById("products")
.innerHTML = html;

}

function addToCart(name, price){

const product = products.find(p => p.name === name);

if(!product){
alert("Product not found");
return;
}

const alreadyInCart = cart.filter(
item => item.productId === product.id
).length;

if(alreadyInCart >= Number(product.stock)){
alert("❌ You cannot add more than the available stock.");
return;
}

cart.push({
name: name,
price: price,
productId: product.id
});

document.getElementById("cartCount").innerText = cart.length;

renderCart();

}
function renderCart(){

let html="";

cart.forEach((item,index)=>{

html += `
<li>
${item.name} - ₹${item.price}
<button onclick="removeFromCart(${index})">❌</button>
</li>
`;

});

document.getElementById("cartItems")
.innerHTML = html;

}

  function removeFromCart(index){

cart.splice(index,1);

document.getElementById("cartCount")
.innerText = cart.length;

renderCart();

}

async function checkoutWhatsApp(){

let customerName =
document.getElementById("customerName").value;

let customerPhone =
document.getElementById("customerPhone").value;

let customerAddress =
document.getElementById("customerAddress").value;

if(!customerName || !customerPhone || !customerAddress){

alert("Please fill Name, Phone Number and Address");

return;

}

if(cart.length === 0){

alert("Your cart is empty");

return;

}

let orderProducts = "";

let total = 0;

cart.forEach(item=>{

orderProducts += `${item.name} - ₹${item.price}\n`;

total += Number(item.price);

});

const orderResponse = await fetch(
`${SUPABASE_URL}/rest/v1/orders`,
{
method:"POST",

headers:{
apikey: SUPABASE_KEY,
Authorization: `Bearer ${SUPABASE_KEY}`,
"Content-Type":"application/json",
Prefer:"return=minimal"
},

body:JSON.stringify({

customer_name: customerName,

customer_phone: customerPhone,

customer_address: customerAddress,

products: orderProducts,

total: total,

status: "Pending"

})

}
);

if(!orderResponse.ok){

alert("❌ Order could not be saved");

console.log(await orderResponse.text());

return;

}
  for(const item of cart){

const product = products.find(
p => p.id === item.productId
);

if(!product){
continue;
}

const newStock = Number(product.stock) - 1;

const stockResponse = await fetch(
`${SUPABASE_URL}/rest/v1/products?id=eq.${item.productId}`,
{
method:"PATCH",
headers:{
apikey: SUPABASE_KEY,
Authorization: `Bearer ${SUPABASE_KEY}`,
"Content-Type":"application/json"
},
body:JSON.stringify({
stock:newStock
})
}
);

if(stockResponse.ok){

product.stock = newStock;

}

}

let message =
`Hello UVID Arts and Crafts

Name: ${customerName}
Phone: ${customerPhone}
Address: ${customerAddress}

Order:

${orderProducts}
Total: ₹${total}`;

window.open(
`https://wa.me/919972790229?text=${encodeURIComponent(message)}`
);

}

renderProducts();

</script>

</body>
</html>
